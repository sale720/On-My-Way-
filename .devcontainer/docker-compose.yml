# Codespaces / Dev Containers: the app container + a private PostgreSQL 16 (test data only).
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_HOST: db
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: omw
      POSTGRES_PASSWORD: omw_codespace_only
      POSTGRES_DB: omw_development
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

volumes:
  pgdata:
